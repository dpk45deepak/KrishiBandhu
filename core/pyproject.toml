[project]
name = "agrimind-ai"
version = "0.1.0"
description = "AgriMind AI - Agricultural Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "hydra-core>=1.3.2",
    "pyyaml>=6.0.1",
    "plotly>=5.18.0",
    "ydata-profiling>=4.6.0",
    "sweetviz>=2.3.0",
    "missingno>=0.5.2",
    "scikit-learn>=1.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "black>=24.0.0",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",
    "tabulate>=0.9.0",
]

[project.scripts]
agrimind = "main:app"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["your_actual_folder_name"]
